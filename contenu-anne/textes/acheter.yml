titre: "Acheter"
description: "Primo-accédants et investisseurs : la recherche accompagnée — Anne repère, visite en premier, présélectionne, et reste après l'achat."
intro: "Un premier achat et un investissement ne se préparent pas de la même façon. Dans les deux cas, le travail commence avant la première visite."
intro_court: "Le travail commence avant la première visite."
bouton: "Parler de votre projet"
primo:
  chapeau: "Primo-accédants"
  titre: "Un premier achat tenu"
  texte: "Budget réel, capacité d'emprunt validée avec un courtier, charges et travaux chiffrés avant l'offre. Rien ne part avant que le financement tienne."
  texte_court: "Budget réel, capacité d'emprunt validée, charges et travaux chiffrés avant l'offre."
investisseurs:
  chapeau: "Investisseurs"
  titre: "Un actif, pas un coup de cœur"
  texte: "Rendement, fiscalité, revente, saisonnalité du bassin lémanique. Le bien est regardé sur dix ans, pas sur une visite."
  texte_court: "Rendement, fiscalité, revente, saisonnalité du bassin lémanique."
recherche:
  titre: "La recherche accompagnée"
  intro: "Quatre temps, dans cet ordre. Anne travaille pour l'acheteur, pas pour le bien."
  intro_court: "Quatre temps, dans cet ordre."
  temps:
    - titre: "Elle repère"
      texte: "Le réseau local, les ventes qui se préparent, celles qui ne sont pas encore en ligne."
      texte_court: "Le réseau local, les ventes qui ne sont pas encore en ligne."
    - titre: "Elle visite en premier"
      texte: "Seule, avec vos critères en tête. Vous ne déplacez pas votre semaine pour rien."
      texte_court: "Seule, avec vos critères en tête."
    - titre: "Elle présélectionne"
      texte: "Trois ou quatre biens, avec ce qui va et ce qui ne va pas dit avant la visite."
      texte_court: "Trois ou quatre biens, le pour et le contre dits avant la visite."
    - titre: "Elle reste après l’achat"
      texte: "Artisans, syndic, formalités : le dossier ne se referme pas à la remise des clés."
      texte_court: "Artisans, syndic, formalités."
avis:
  titre: "Ils ont acheté avec Anne"
  intro: "Avis Immodvisor d'acheteurs, repris entiers — la même source vérifiable que sur l'accueil."
  intro_court: "Avis Immodvisor d'acheteurs, entiers."
