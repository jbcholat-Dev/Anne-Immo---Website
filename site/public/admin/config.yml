# Espace d'édition du site d'Anne (Sveltia CMS) — story 7.13, décision du 2026-10-05.
# Chaque enregistrement devient un fichier de contenu-anne/ dans le dépôt, via une demande de fusion que JB valide.
# Réglage complet : https://sveltiacms.app/en/docs — à modifier par PR, jamais depuis l'espace d'édition.

backend:
  name: github
  repo: jbcholat-Dev/Anne-Immo---Website
  branch: main
  # Petit programme de connexion « Se connecter avec GitHub », hébergé sur Cloudflare (RUNBOOK § 1).
  base_url: https://sveltia-cms-auth.jbcholat.workers.dev
  commit_messages:
    create: "Contenu ({{author-login}}) : nouvelle fiche {{collection}} « {{slug}} »"
    update: "Contenu ({{author-login}}) : {{collection}} « {{slug}} » modifiée"
    delete: "Contenu ({{author-login}}) : {{collection}} « {{slug}} » supprimée"
    uploadMedia: "Contenu ({{author-login}}) : photo « {{path}} » ajoutée"
    deleteMedia: "Contenu ({{author-login}}) : photo « {{path}} » supprimée"

# Brouillons : chaque modification part sur une branche avec sa demande de fusion ;
# Cloudflare en construit un aperçu protégé ; JB fusionne sur GitHub pour mettre en ligne (bouton « Publier » masqué : publish: false).
publish_mode: editorial_workflow

site_url: https://annevialtissot.fr
display_url: https://annevialtissot.fr

# Dossier par défaut (inutilisé par les fiches, qui rangent leurs photos dans leur propre dossier).
media_folder: contenu-anne/photos
public_folder: photos

media_libraries:
  default:
    config:
      max_file_size: 52428800   # 50 Mo avant réduction
      slugify_filename: true
      # Les photos sont réduites dans le navigateur avant l'envoi : WebP, 3 200 px maximum.
      # L'original HD n'entre jamais dans le dépôt (règle : photos HD hors Git).
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 3200
          height: 3200

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: stories
    label: Ventes racontées
    label_singular: Vente
    description: >
      Une fiche par vente : le récit d'Anne, à la première personne. Ni prix, ni nom de client.
      Une fiche n'est visible sur le site public qu'en statut « Publiée ».
    folder: contenu-anne/stories
    path: "{{slug}}/fr"
    extension: md
    format: frontmatter
    create: true
    delete: false
    publish: false   # la mise en ligne se fait en fusionnant la demande sur GitHub (JB), pas depuis l'espace d'édition
    slug: "{{commune}}-{{annee_vente}}"
    identifier_field: commune
    summary: "{{commune}} · {{type_bien}} · {{annee_vente}} · {{statut}}"
    sortable_fields: [annee_vente, commune, statut]
    media_folder: photos
    public_folder: photos
    fields:
      - { name: commune, label: Commune, widget: string }
      - { name: type_bien, label: Type de bien, widget: string, hint: "Ex. « Appartement (T3) », « Chalet ». Sans nom de résidence." }
      - { name: annee_vente, label: Année de la vente, widget: number, value_type: int, required: false }
      - { name: delai_vente, label: Délai de vente, widget: string, required: false, hint: "Ex. « 2 mois ». Laisser vide si on ne le dit pas." }
      - { name: particularite, label: En une phrase, widget: text, required: false, hint: "Ce qui rend cette vente particulière. Affiché sous la photo dans la liste des ventes." }
      - name: photo_principale
        label: Photo principale
        widget: image
        required: false
        hint: "La photo en tête de la fiche, au format paysage de préférence. Elle est réduite automatiquement à l'envoi."
      - name: photos
        label: Autres photos (4 à 6)
        widget: image
        multiple: true
        required: false
        hint: "Envoyer 5 à 10 photos au plus par enregistrement."
      - name: statut
        label: Statut
        widget: select
        default: brouillon
        options:
          - { label: "Brouillon (visible seulement sur l'aperçu)", value: brouillon }
          - { label: "À relire", value: a-relire }
          - { label: "Publiée (visible sur le site public)", value: publie }
        hint: "« Publiée » seulement quand les clients ont donné leur accord. L'aperçu montre toutes les fiches, quel que soit le statut. Le témoignage affiché est l'avis Immodvisor relié à cette vente (rubrique Avis, champ « Vente concernée »)."
      - { name: body, label: Récit, widget: markdown, hint: "À la première personne. Des intertitres courts (« Le résultat ») aident la lecture." }

  - name: pages
    label: Pages
    label_singular: Page
    folder: contenu-anne/pages
    path: "{{slug}}/fr"
    extension: md
    format: frontmatter
    create: false
    delete: false
    publish: false
    identifier_field: titre
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: sous_titre, label: Sous-titre, widget: text, required: false }
      - { name: video, label: Vidéo, widget: string, required: false, hint: "Laisser vide : pas de bloc vidéo." }
      - { name: portrait, label: "Portrait d'Anne", widget: image, required: false, hint: "Photo verticale d'Anne (format portrait, 4:5 ou plus haute). Affichée sur À propos, l'accueil et le diagnostic. Laisser vide : emplacement réservé." }
      - { name: statut, label: Statut, widget: select, options: [brouillon, a-relire, publie], default: brouillon }
      - { name: body, label: Texte, widget: markdown, hint: "Le site découpe ce texte selon ses titres : avant « Ma méthode » (titre 1), la colonne Qui suis-je ?, un bloc par titre 2 ; « Les trois piliers » : un paragraphe « **Nom :** texte » par pilier ; « Concrètement… » : un titre 3 « 1. Titre » par point ; « Cible » (titre 1) : une phrase d'introduction puis un titre 2 par profil ; « Réseau eXp » (titre 1) : texte libre. Garder ces titres." }

  - name: textes
    label: Textes des pages
    label_singular: Textes
    description: >
      Les textes de l'accueil et des pages Vendre, Acheter et Contact. On change les mots, pas la mise en page :
      chaque champ correspond à un endroit précis de la page. Un champ « (téléphone) » est la version courte affichée
      sur téléphone ; vide, le téléphone affiche le texte complet. L'anglais n'est pas modifié ici.
    publish: false
    files:
      - name: accueil
        label: Accueil
        file: contenu-anne/textes/accueil.yml
        fields:
          - { name: description, label: Description pour Google, widget: text, hint: "Le résumé affiché sous le titre dans les résultats de recherche. Deux phrases au plus." }
          - name: ouverture
            label: Ouverture (vidéo)
            widget: object
            fields:
              - { name: ligne, label: Phrase sous le nom, widget: string }
              - { name: bouton_diagnostic, label: Bouton du diagnostic, widget: string }
              - { name: bouton_diagnostic_court, label: "Bouton du diagnostic (téléphone)", widget: string, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
              - { name: bouton_estimation, label: "Bouton de l'estimation", widget: string }
          - name: ventes
            label: Ventes récentes
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: lien, label: Lien vers toutes les ventes, widget: string }
          - name: methode
            label: Ma méthode
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: lien, label: Lien vers la méthode, widget: string }
              - name: piliers
                label: Les piliers
                label_singular: Pilier
                widget: list
                hint: "Trois piliers : la mise en page est prévue pour trois."
                fields:
                  - { name: titre, label: Nom, widget: string }
                  - { name: texte, label: Texte, widget: text }
              - { name: refrain, label: Refrain (une phrase par ligne), widget: list, field: { name: ligne, label: Phrase, widget: string }, hint: "Les phrases qui apparaissent une à une." }
          - name: avis
            label: Avis
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
          - name: diagnostic
            label: Diagnostic
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }
              - { name: texte_court, label: "Texte (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
              - { name: bouton, label: Bouton, widget: string }
              - { name: score, label: "Encart « /100 »", widget: string }
              - { name: axes, label: "Encart « 3 »", widget: string }
              - { name: plan, label: "Encart « 1 »", widget: string }
          - name: anne
            label: Anne
            widget: object
            fields:
              - { name: texte, label: Texte, widget: text }
              - { name: texte_court, label: "Texte (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
              - { name: langues, label: Langues, widget: string }
              - { name: langues_court, label: "Langues (téléphone)", widget: string, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
              - { name: lien, label: "Lien vers « À propos »", widget: string }
          - name: parler
            label: Parler à Anne (bas de page)
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }
              - { name: bouton_rendez_vous, label: Bouton du rendez-vous, widget: string }
              - { name: bouton_ecrire, label: "Bouton « Écrire »", widget: string }

      - name: vendre
        label: Vendre
        file: contenu-anne/textes/vendre.yml
        fields:
          - { name: titre, label: Titre de la page, widget: string, hint: "Le menu garde son libellé « Vendre »." }
          - { name: description, label: Description pour Google, widget: text }
          - { name: intro, label: Introduction, widget: text }
          - { name: intro_court, label: "Introduction (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
          - name: diagnostic
            label: Bloc « Faire le point »
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: titre_court, label: "Titre (téléphone)", widget: string, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
              - { name: texte, label: Texte, widget: text }
              - { name: texte_court, label: "Texte (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
              - { name: bouton, label: Bouton, widget: string }
          - name: estimation
            label: Bloc « Faire estimer mon bien »
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }
              - { name: texte_court, label: "Texte (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
              - { name: bouton, label: Bouton, widget: string }
          - name: formulaire
            label: "Formulaire d'estimation"
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: intro, label: Texte au-dessus du formulaire, widget: text }

      - name: acheter
        label: Acheter
        file: contenu-anne/textes/acheter.yml
        fields:
          - { name: titre, label: Titre de la page, widget: string, hint: "Le menu garde son libellé « Acheter »." }
          - { name: description, label: Description pour Google, widget: text }
          - { name: intro, label: Introduction, widget: text }
          - { name: intro_court, label: "Introduction (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
          - { name: bouton, label: "Bouton « Parler de votre projet »", widget: string }
          - name: primo
            label: Primo-accédants
            widget: object
            fields:
              - { name: chapeau, label: Petit titre, widget: string }
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }
              - { name: texte_court, label: "Texte (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
          - name: investisseurs
            label: Investisseurs
            widget: object
            fields:
              - { name: chapeau, label: Petit titre, widget: string }
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }
              - { name: texte_court, label: "Texte (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
          - name: recherche
            label: La recherche accompagnée
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - { name: intro_court, label: "Introduction (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
              - name: temps
                label: Les étapes
                label_singular: Étape
                widget: list
                hint: "Quatre étapes : la mise en page est prévue pour quatre. Elles sont numérotées dans l'ordre."
                fields:
                  - { name: titre, label: Titre, widget: string }
                  - { name: texte, label: Texte, widget: text }
                  - { name: texte_court, label: "Texte (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
          - name: avis
            label: Avis des acheteurs
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - { name: intro_court, label: "Introduction (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }

      - name: contact
        label: Contact
        file: contenu-anne/textes/contact.yml
        fields:
          - { name: titre, label: Titre de la page, widget: string }
          - { name: description, label: Description pour Google, widget: text }
          - { name: intro, label: Introduction, widget: text }
          - { name: intro_court, label: "Introduction (téléphone)", widget: text, required: false, hint: "Ce que voit un téléphone. Laisser vide : le texte complet." }
          - name: rendez_vous
            label: Réserver un créneau
            widget: object
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }
              - { name: bouton, label: "Bouton d'ouverture de l'agenda", widget: string }

  - name: avis
    label: Avis Immodvisor
    label_singular: Avis
    description: >
      Les avis sont recopiés tels quels depuis Immodvisor et ne se corrigent pas.
      Trois champs sont à remplir : la vente concernée, la phrase mise en avant et « cité sur l'accueil ».
    folder: contenu-anne/avis-immodvisor
    filter: { field: id, pattern: "^20" }
    extension: md
    format: frontmatter
    create: false
    delete: false
    publish: false
    identifier_field: id
    summary: "{{date}} · {{auteur}} · {{role}}"
    fields:
      - { name: id, label: Identifiant, widget: string, readonly: true }
      - { name: auteur, label: Auteur, widget: string, readonly: true }
      - { name: date, label: Date, widget: string, readonly: true }
      - { name: note, label: Note, widget: number, readonly: true }
      - { name: role, label: Rôle, widget: string, readonly: true }
      - { name: titre, label: Titre, widget: string, readonly: true }
      - { name: vente_candidate, label: Vente proposée par Claude, widget: string, readonly: true, required: false }
      - { name: dossier_photos, label: Ancien dossier photos, widget: string, readonly: true, required: false }
      - { name: confiance, label: Confiance du rapprochement, widget: string, readonly: true, required: false }
      - { name: indice, label: Indice du rapprochement, widget: text, readonly: true, required: false }
      - name: story
        label: Vente concernée
        widget: relation
        collection: stories
        value_field: "{{slug}}"
        search_fields: [commune, type_bien]
        display_fields: ["{{commune}} · {{type_bien}} · {{annee_vente}}"]
        required: false
        hint: "La vente que cet avis concerne. C'est ce champ que le site lit."
      - { name: phrase, label: Phrase mise en avant, widget: text, required: false, hint: "Une phrase de l'avis, recopiée mot pour mot (copier-coller depuis le texte ci-dessous), affichée en grand en tête de la carte d'avis. Si elle ne figure pas telle quelle dans l'avis, elle n'est pas affichée. Laisser vide : la carte s'affiche sans phrase." }
      - { name: retenu, label: Cité en entier sur l'accueil, widget: boolean, default: false, required: false }
      - { name: body, label: Texte de l'avis (tel quel), widget: markdown, readonly: true }

  - name: legal
    label: Coordonnées
    publish: false
    files:
      - name: identite
        label: Coordonnées légales et réseaux
        file: contenu-anne/legal/identite.md
        format: frontmatter
        fields:
          - { name: nom_complet, label: Nom complet, widget: string }
          - { name: statut_juridique, label: Statut, widget: string }
          - { name: rsac, label: Numéro RSAC et ville du greffe, widget: string, required: false }
          - { name: carte_professionnelle, label: Carte professionnelle (référence eXp), widget: string, required: false }
          - { name: adresse_professionnelle, label: Adresse professionnelle, widget: string, required: false, hint: "Affichée seulement dans les mentions légales." }
          - { name: telephone, label: Téléphone, widget: string, required: false, hint: "Format international, ex. +33 6 …" }
          - { name: email, label: E-mail, widget: string, required: false }
          - { name: url_immodvisor, label: Fiche Immodvisor, widget: string }
          - { name: zone, label: Zone, widget: string }
          - { name: langues, label: Langues, widget: list, required: false }
          - { name: url_instagram, label: Instagram, widget: string, required: false }
          - { name: url_youtube, label: YouTube, widget: string, required: false }
          - { name: url_linkedin, label: LinkedIn, widget: string, required: false }
          - { name: body, label: Note, widget: markdown, required: false }
